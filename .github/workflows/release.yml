name: release

# Pushing a tag such as v1.0.0 builds the installers and attaches them to a
# DRAFT GitHub release. Nothing is published until someone presses "Publish"
# on the draft, so the files can be tried first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag=$tag package.json=$package tauri.conf.json=$tauri Cargo.toml=$cargo"
          for v in "$package" "$tauri" "$cargo"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match the app version ($v). Bump package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml first."
              exit 1
            fi
          done

  build:
    name: build ${{ matrix.os }}
    needs: check-version
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Third-party actions are pinned to a commit: a tag or branch can be moved
      # after the fact, and this job produces the files people install.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No Rust cache here on purpose: a release is built from a clean slate,
      # not from a cache earlier runs wrote.
      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # tauri::generate_context! needs the built frontend (../dist) to exist.
      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find installers -type f | sort)
          printf 'Attaching:\n'; printf '  %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --draft \
            --title "Console Presence $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
