[package]
name = "console-presence"
version = "1.0.0"
description = "Show your console game on Discord with Rich Presence"
authors = ["GiToon10100011"]
license = "MIT"
repository = "https://github.com/GiToon10100011/discord_console_presence"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "console_presence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1.1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
sha2 = "0.11.1"
hex = "0.4.3"
url = "2.5.8"
thiserror = "2.0.21"
log = "0.4.35"
uuid = { version = "1.29.1", features = ["v4"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1.54.1", features = ["time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
